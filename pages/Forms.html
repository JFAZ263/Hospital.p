<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<header>
    <h1 style="text-align: center;">Hospital San Pato</h1>
    <h3 style="text-align: center;">Nos importa tu salud</h3>
</header>
<nav>
    <a href="index.html">Home</a>
    <a href="/pages/Forms.html">Agendar una cita</a>

<body>
    <h1 style="text-align: center;">¿Necesitas atención médica?</h1>
    <h3 style="text-align: center;">Llena el siguiente fórmulario y agendaremos tu cita!</h3>
    <form>
        <label for="nombre">Ingrese sus dos nombres:</label>
        <br><br>
        <input type="text" id="nombre" placeholder="Los dos nombres" size="15" required>
        <br><br>
        <label for="apellido">Ingrese sus dos apellidos:</label>
        <br><br>
        <input type="text" id="apellido" placeholder="Los dos apellidos" size="15" required>
        <br><br>
        <label for="cedula">Ingrese su número de cédula</label>
        <br><br>
        <input type="text" id="cedula" placeholder="Número de cédula" size="15" required>
        <br><br>
        <label for="">Fecha de nacimiento:</label>
        <br><br>
        <input type="date">
    </form>
</body>
</html>
